.pp-edit img{width:80px;height:80px;border-radius:50%;object-fit:cover}
.pp-edit span{position:absolute;right:0;bottom:0;width:24px;height:24px;border-radius:50%;background:var(--input);display:flex;align-items:center;justify-content:center;font-size:12px}
.req-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--pill);border:1px solid var(--border);background:var(--bg);margin-bottom:6px;min-width:0;max-width:100%;overflow:hidden}
.req-actions{display:flex;gap:6px;margin-left:auto}
.req-ok,.req-no{width:34px;height:34px;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
.req-ok{background:#22c55e}
.req-no{background:var(--danger)}
.req-box{background:var(--surface);width:100%;max-width:380px;border-radius:22px;border:1px solid var(--border);padding:22px 18px}
.req-user{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:var(--pill);padding:10px 14px;background:var(--bg);margin:16px 0}
.req-btns{display:flex;gap:10px}
.req-btns button{flex:1;height:44px;border-radius:var(--pill);font-weight:600;cursor:pointer;font-size:15px}
.req-yes{background:var(--accent);color:#fff;border:none}
.req-cancel{background:var(--bg);color:var(--fg);border:1px solid var(--border)}
.req-title{text-align:center;font-size:16px;font-weight:600}
#toasts{position:fixed;top:14px;right:14px;z-index:90;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--pill);padding:10px 16px;color:var(--fg);box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:min(92vw,360px);font-size:14px;font-weight:500}
.toast-check{width:22px;height:22px;border-radius:50%;background:#22c55e;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
@media(max-width:700px){.sidebar{width:100%;min-width:100%}.sidebar.hidden-mobile{display:none}.chat-area.hidden-mobile{display:none}#back-to-friends,#back-group{display:flex!important}}
@media(max-width:700px){
  #group-member-pills{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;min-width:0;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none;touch-action:pan-x}
  #group-member-pills::-webkit-scrollbar{display:none}
  #group-member-pills .member-pill{flex:0 0 auto;white-space:nowrap}
}
@media(min-width:701px){#back-to-friends,#back-group{display:none!important}}
</style>
</head>

function authEmail(id){return String(id).toLowerCase().replace(/[^a-z0-9_]/g,"")+"@chatlink.app"}
/* === Messages d'erreur Firebase (cette fonction manquait : les erreurs étaient avalées en silence) === */
function fbErrMsg(e){
  const c=(e&&e.code)||"";
  const map={
    "auth/email-already-in-use":"Cet identifiant est déjà pris.",
    "auth/invalid-email":"Identifiant invalide.",
    "auth/weak-password":"Mot de passe trop faible (6 caractères minimum).",
    "auth/requires-recent-login":"Pour des raisons de sécurité, reconnecte-toi puis réessaie.",
    "auth/operation-not-allowed":"Inscription désactivée : dans la console Firebase, active Authentication > Méthode de connexion > E-mail/Mot de passe.",
    "auth/operation-not-supported-in-this-environment":"Firebase ne marche pas depuis un fichier local : héberge la page en https (GitHub Pages, Netlify, Firebase Hosting).",
    "auth/unauthorized-domain":"Domaine non autorisé : ajoute-le dans Firebase > Authentication > Paramètres > Domaines autorisés.",
    "auth/network-request-failed":"Problème réseau. Vérifie ta connexion et réessaie.",
    "auth/too-many-requests":"Trop de tentatives, réessaie dans quelques minutes.",
    "auth/user-not-found":"Compte introuvable.",
    "auth/wrong-password":"Mot de passe incorrect.",
    "auth/invalid-credential":"Identifiant ou mot de passe incorrect.",
    "auth/invalid-login-credentials":"Identifiant ou mot de passe incorrect.",
    "permission-denied":"Firestore refuse l'accès : vérifie les règles de sécurité de la base de données.",
    "unavailable":"Base de données injoignable, réessaie."
  };
  return map[c]||("Erreur"+(c?" ("+c+")":"")+" : "+((e&&e.message)||e));
}
function dmKey(a,b){return [a,b].sort().join("_")}
let unsubMsgs=null, unsubFriends=null, unsubUser=null, unsubGroups=null;
function stopFbListeners(){
  if(unsubMsgs){try{unsubMsgs()}catch(_){} unsubMsgs=null}
  if(unsubFriends){try{unsubFriends()}catch(_){} unsubFriends=null}
  if(unsubUser){try{unsubUser()}catch(_){} unsubUser=null}
  if(unsubGroups){try{unsubGroups()}catch(_){} unsubGroups=null}
}
async function fbUpsertUser(id, data){
  if(!fbReady)return;
  await fbDb.collection("users").doc(id).set({...data, id, updatedAt: Date.now()}, {merge:true});
}
async function fbGetUser(id){
  if(!fbReady)return null;
  const s=await fbDb.collection("users").doc(id).get();
  return s.exists?s.data():null;
}
async function fbSetFriends(uid, list){
  if(!fbReady)return;
  await fbDb.collection("friends").doc(uid).set({list:list||[], updatedAt:Date.now()}, {merge:true});
}
async function fbGetFriends(uid){
  if(!fbReady)return null;
  const s=await fbDb.collection("friends").doc(uid).get();
  return s.exists?(s.data().list||[]):null;
}
async function fbSetRequests(uid, list){
  if(!fbReady)return;
  await fbDb.collection("requests").doc(uid).set({list:list||[], updatedAt:Date.now()}, {merge:true});
}
async function fbGetRequests(uid){
  if(!fbReady)return null;
  const s=await fbDb.collection("requests").doc(uid).get();
  return s.exists?(s.data().list||[]):null;
}
async function fbPushMessage(a,b,msg){
  if(!fbReady)return;
  const k=dmKey(a,b);
  await fbDb.collection("chats").doc(k).collection("messages").add({...msg, chatId:k});
  await fbDb.collection("chats").doc(k).set({users:[a,b].sort(), lastTs: msg.time||msg.ts||Date.now()}, {merge:true});
}
function fbListenMessages(a,b, onData){
  if(!fbReady)return ()=>{};
  const k=dmKey(a,b);
  return fbDb.collection("chats").doc(k).collection("messages").orderBy("time").onSnapshot(snap=>{
    const list=[]; snap.forEach(d=>list.push({id:d.id, ...d.data()}));
    onData(list);
  }, err=>console.warn(err));
}
async function fbUpsertGroup(g){
  if(!fbReady||!g||!g.id)return;
  await fbDb.collection("groups").doc(g.id).set({...g, updatedAt:Date.now()}, {merge:true});
}
async function fbGetGroupsFor(uid){
  if(!fbReady)return [];
  const snap=await fbDb.collection("groups").where("memberIds","array-contains",uid).get();
  const out=[]; snap.forEach(d=>out.push(d.data()));
  return out;
}
async function fbPushGMsg(gid,msg){
  if(!fbReady)return;
  await fbDb.collection("groups").doc(gid).collection("messages").add({...msg});
}
function fbListenGMsgs(gid, onData){
  if(!fbReady)return ()=>{};
  return fbDb.collection("groups").doc(gid).collection("messages").orderBy("time").onSnapshot(snap=>{
    const list=[]; snap.forEach(d=>list.push({id:d.id, ...d.data()}));
    onData(list);
  }, err=>console.warn(err));
}
async function fbPullBootstrap(uid){
  if(!fbReady)return;
  // friends
  const fl=await fbGetFriends(uid);
  if(fl){ const all=load(STORAGE.friends,{}); all[uid]=fl; save(STORAGE.friends,all); }
  const rq=await fbGetRequests(uid);
  if(rq){ const all=load(STORAGE.requests,{}); all[uid]=rq; save(STORAGE.requests,all); }
  // merge group docs
  try{
    const gs=await fbGetGroupsFor(uid);
    if(gs.length){
      const all=getGroups();
      gs.forEach(g=>{ if(g&&g.id){ g._cloud=true; all[g.id]=g; } });
      saveGroups(all);
    }
  }catch(e){console.warn("groups pull",e)}
  // cache friend profiles
  const friends=getFriends(uid);
  for(const fid of friends){
    try{
      const u=await fbGetUser(fid);
      if(u){ const users=getUsers(); users[fid]={...users[fid], ...u, password: users[fid]&&users[fid].password}; save(STORAGE.users,users); }
    }catch(_){}
  }
}


function load(k,f){try{const r=localStorage.getItem(k);return r?JSON.parse(r):(f??{})}catch{return f??{}}}
function save(k,d){localStorage.setItem(k,JSON.stringify(d))}
function getUsers(){return load(STORAGE.users,{})}
function getSession(){return load(STORAGE.session,null)}
function setSession(id){id?save(STORAGE.session,id):localStorage.removeItem(STORAGE.session)}
function getFriends(uid){return load(STORAGE.friends,{})[uid]||[]}
function setFriends(uid,list){const a=load(STORAGE.friends,{});a[uid]=list;save(STORAGE.friends,a)}
function getReqMap(){return load(STORAGE.requests,{})}
function incomingFor(uid){return getReqMap()[uid]||[]}
/* Écriture dans Firestore d'une liste (amis / demandes) : ajout ou retrait d'un élément */
function cloudList(col,docId,op,val){
  if(!fbReady||!fbAuth||!fbAuth.currentUser) return;
  const FV=firebase.firestore.FieldValue;
  fbDb.collection(col).doc(docId).set({list:op==="add"?FV.arrayUnion(val):FV.arrayRemove(val),updatedAt:Date.now()},{merge:true})
    .catch(e=>{console.warn("Firestore",col,e);showToast("Erreur Firebase : "+fbErrMsg(e))});
}
function cleanGroup(g){const c=JSON.parse(JSON.stringify(g));delete c._cloud;c.memberIds=(c.members||[]).map(m=>m.id);return c}
function cloudGroupSave(g){
  if(!fbReady||!fbAuth||!fbAuth.currentUser||!g||!g.id) return;
  fbDb.collection("groups").doc(g.id).set({...cleanGroup(g),updatedAt:Date.now()})
    .catch(e=>{console.warn("group",e);showToast("Groupe non synchronisé : "+fbErrMsg(e))});
}
function cloudGroupDelete(gid){
  if(!fbReady||!fbAuth||!fbAuth.currentUser||!gid) return;
  fbDb.collection("groups").doc(gid).delete().catch(e=>console.warn("group delete",e));
}
function addRequest(from,to){const a=getReqMap();if(!a[to])a[to]=[];if(!a[to].includes(from))a[to].push(from);save(STORAGE.requests,a);cloudList("requests",to,"add",from)}
function removeRequest(from,to){const a=getReqMap();a[to]=(a[to]||[]).filter(x=>x!==from);save(STORAGE.requests,a);cloudList("requests",to,"remove",from)}
function becomeFriends(a,b){
  const mine=getFriends(a);if(!mine.includes(b)){mine.push(b);setFriends(a,mine)}
  const theirs=getFriends(b);if(!theirs.includes(a)){theirs.push(a);setFriends(b,theirs)}
  cloudList("friends",a,"add",b);cloudList("friends",b,"add",a);
  removeRequest(a,b);removeRequest(b,a);
}
function outgoingFor(uid){const a=getReqMap();return Object.keys(a).filter(to=>(a[to]||[]).includes(uid))}
function getOutSeen(uid){const a=load(STORAGE.outSeen,{});return Object.prototype.hasOwnProperty.call(a,uid)?a[uid]:null}
function setOutSeen(uid,list){const a=load(STORAGE.outSeen,{});a[uid]=list;save(STORAGE.outSeen,a)}

function closeOverlayEl(el, after){
  if(!el||el.classList.contains("hidden")){if(after)after();return}
  if(el.classList.contains("closing"))return;
  el.classList.add("closing");
  // force style recalc so animation starts
  void el.offsetWidth;
  setTimeout(()=>{
    el.classList.add("hidden");
    el.classList.remove("closing");
    if(after)after();
  },230);
}

function showToast(text){
  const wrap=document.getElementById("toasts");
  const el=document.createElement("div");el.className="toast";
  el.innerHTML=`<span class="toast-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></span><span>${esc(text)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{
    el.style.transition="opacity .28s ease, transform .28s ease";
    el.style.opacity="0";
    el.style.transform="translateX(16px)";
    setTimeout(()=>{if(el.parentNode)el.remove()},300);
  },4700);
}
function syncOutgoing(){
  if(!currentUser)return;
  const cur=outgoingFor(currentUser.id);
  const friends=getFriends(currentUser.id);
  const prev=getOutSeen(currentUser.id);
  if(prev){
    prev.forEach(fid=>{
      if(!cur.includes(fid)&&friends.includes(fid)) showToast("@"+fid+" a accepté votre demande !");
    });
  }
  setOutSeen(currentUser.id,cur);
}
function getMessages(a,b){return load(STORAGE.messages,{})[[a,b].sort().join("|")]||[]}
function addMessage(a,b,msg){const all=load(STORAGE.messages,{});const k=[a,b].sort().join("|");if(!all[k])all[k]=[];all[k].push(msg);save(STORAGE.messages,all)}
function setConv(a,b,list){const all=load(STORAGE.messages,{});all[[a,b].sort().join("|")]=list;save(STORAGE.messages,all)}
function getGroups(){return load(STORAGE.groups,{})}
function saveGroups(g){save(STORAGE.groups,g)}
function myGroups(){if(!currentUser)return[];return Object.values(getGroups()).filter(g=>(g.members||[]).some(m=>m.id===currentUser.id))}
function getGMsgs(gid){return load(STORAGE.gmsgs,{})[gid]||[]}
function addGMsg(gid,msg){const all=load(STORAGE.gmsgs,{});if(!all[gid])all[gid]=[];all[gid].push(msg);save(STORAGE.gmsgs,all)}
function setGMsgs(gid,list){const all=load(STORAGE.gmsgs,{});all[gid]=list;save(STORAGE.gmsgs,all)}
function getGroupSeen(uid){return load(STORAGE.gseen,{})[uid]||[]}
function setGroupSeen(uid,list){const a=load(STORAGE.gseen,{});a[uid]=list;save(STORAGE.gseen,a)}
function syncGroupNotices(){
  if(!currentUser)return;
  const mine=myGroups();
  const seen=getGroupSeen(currentUser.id);
  mine.forEach(g=>{
    if(!seen.includes(g.id)&&g.createdBy!==currentUser.id) showToast("@"+g.createdBy+" vous a ajouté dans un groupe !");
  });
  setGroupSeen(currentUser.id, mine.map(g=>g.id));
}
function loadMsgs(){
  if(activeGroupId) return getGMsgs(activeGroupId);
  if(activeFriendId) return getMessages(currentUser.id, activeFriendId);
  return [];
}
function storeMsgs(list){
  if(activeGroupId){
    setGMsgs(activeGroupId, list);
    if(fbReady){
      const gid=activeGroupId;
      list.forEach(m=>{
        if(m&&m.id&&m.poll){
          const {id,...rest}=m;
          fbDb.collection("groups").doc(gid).collection("messages").doc(id).set(rest).catch(e=>console.warn(e));
        }
      });
    }
  }
  else if(activeFriendId){
    setConv(currentUser.id, activeFriendId, list);
    if(fbReady){
      const k=dmKey(currentUser.id, activeFriendId);
      list.forEach(m=>{
        if(m&&m.id&&m.poll){
          const {id,...rest}=m;
          fbDb.collection("chats").doc(k).collection("messages").doc(id).set(rest).catch(e=>console.warn(e));
        }
      });
    }
  }
}
function pushMsg(msg){
  if(activeGroupId){
    addGMsg(activeGroupId, msg);
    if(fbReady) fbPushGMsg(activeGroupId, msg).catch(e=>{console.warn(e);showToast("Message non envoyé : "+fbErrMsg(e))});
  }
  else if(activeFriendId){
    addMessage(currentUser.id, activeFriendId, msg);
    if(fbReady) fbPushMessage(currentUser.id, activeFriendId, msg).catch(e=>{console.warn(e);showToast("Message non envoyé : "+fbErrMsg(e))});
  }
}
function inChat(){return !!(activeGroupId||activeFriendId)}

function groupAvatar(g){return (g&&g.avatar)||GROUP_AVATAR}
async function hashPassword(pw){const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pw+"chatlink_salt_2024"));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("")}

function av(u){return (u&&u.avatar)||DEFAULT_AVATAR}

let authTabDir="right";
document.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>{
  const prev=document.querySelector(".tab.active");
  if(prev===tab)return;
  const order=["login","register"];
  const prevI=prev?order.indexOf(prev.dataset.tab):0;
  const nextI=order.indexOf(tab.dataset.tab);
  authTabDir=nextI>=prevI?"right":"left";
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".auth-form").forEach(f=>{f.classList.remove("active","from-left")});
  tab.classList.add("active");
  const form=document.getElementById(tab.dataset.tab+"-form");
  if(authTabDir==="left")form.classList.add("from-left");
  form.classList.add("active");
}));
document.querySelectorAll(".pw-toggle").forEach(btn=>btn.addEventListener("click",()=>{
  const i=document.getElementById(btn.dataset.target);i.type=i.type==="password"?"text":"password";
}));
document.getElementById("login-form").addEventListener("submit",async e=>{
  e.preventDefault();
  const errEl=document.getElementById("login-error");
  errEl.textContent="";
  const id=document.getElementById("login-id").value.trim().toLowerCase();
  const password=document.getElementById("login-password").value;
  if(!id||!password){errEl.textContent="Remplis tous les champs.";return}
  if(!fbReady){
    // local fallback only
    const users=getUsers();
    if(!users[id]||users[id].password!==await hashPassword(password)){
      errEl.textContent="Firebase indisponible et compte local introuvable.";return;
    }
    setSession(id);currentUser={id,...users[id]};showApp();return;
  }
  try{
    await fbAuth.signInWithEmailAndPassword(authEmail(id), password);
    let profile=await fbGetUser(id);
    if(!profile){
      profile={displayName:id,banner:"#1d3eb2",avatar:null};
      await fbUpsertUser(id,{...profile, uid:fbAuth.currentUser.uid});
    }
    const users=getUsers();
    users[id]={...users[id], ...profile, displayName:profile.displayName||id};
    save(STORAGE.users,users);
    await fbPullBootstrap(id);
    setSession(id);currentUser={id,...users[id]};showApp();
  }catch(err){
    console.warn(err);
    errEl.textContent=fbErrMsg(err);
  }
});

document.getElementById("register-form").addEventListener("submit",async e=>{
  e.preventDefault();
  const err=document.getElementById("register-error");
  err.textContent="";
  const id=document.getElementById("reg-id").value.trim().toLowerCase();
  const display=document.getElementById("reg-display").value.trim();
  const password=document.getElementById("reg-password").value;
  const confirm=document.getElementById("reg-confirm").value;
  if(!/^[a-z0-9_]{3,20}$/.test(id)){err.textContent="Identifiant invalide.";return}
  if(!display){err.textContent="Indique un pseudo.";return}
  if(password.length<6){err.textContent="Mot de passe : 6 caractères minimum.";return}
  if(password!==confirm){err.textContent="Les mots de passe ne correspondent pas.";return}
  if(!fbReady){
    err.textContent="Firebase non chargé. Vérifie ta connexion et recharge la page.";
    return;
  }
  const btn=e.target.querySelector('button[type="submit"]');
  if(btn){btn.disabled=true}
  try{
    // Créer le compte Auth d'abord
    await fbAuth.createUserWithEmailAndPassword(authEmail(id), password);
    const profile={displayName:display,banner:"#1d3eb2",avatar:null,uid:fbAuth.currentUser.uid,createdAt:Date.now()};
    try{
      await fbUpsertUser(id, profile);
      await fbSetFriends(id, []);
      await fbSetRequests(id, []);
    }catch(fsErr){
      console.warn(fsErr);
      err.textContent=fbErrMsg(fsErr)+" (compte Auth créé, profil à réessayer)";
    }
    const users=getUsers();
    users[id]={...profile};
    save(STORAGE.users,users);
    setFriends(id,[]);
    setSession(id);currentUser={id,...users[id]};showApp();
  }catch(ex){
    console.warn(ex);
    err.textContent=fbErrMsg(ex);
  }finally{
    if(btn){btn.disabled=false}
  }
});

/* Vérifie le mot de passe auprès de Firebase (true / false). Lève une erreur en cas de souci réseau. */
async function fbCheckPassword(pw){
  const u=fbAuth.currentUser;
  const cred=firebase.auth.EmailAuthProvider.credential(u.email,pw);
  try{
    await u.reauthenticateWithCredential(cred);
    return true;
  }catch(e){
    if(["auth/wrong-password","auth/invalid-credential","auth/invalid-login-credentials"].includes(e.code)) return false;
    throw e;
  }
}
/* Supprime le compte dans Firebase : profil, amis, demandes, groupes, puis le compte de connexion */
async function deleteCloudAccount(id){
  stopFbListeners();
  try{
    const FV=firebase.firestore.FieldValue;
    const ops=[];
    getFriends(id).forEach(fid=>ops.push(fbDb.collection("friends").doc(fid).set({list:FV.arrayRemove(id)},{merge:true})));
    const reqs=getReqMap();
    Object.keys(reqs).forEach(to=>{
      if(to!==id&&(reqs[to]||[]).includes(id)) ops.push(fbDb.collection("requests").doc(to).set({list:FV.arrayRemove(id)},{merge:true}));
    });
    const groups=getGroups();
    Object.values(groups).forEach(g=>{
      if(!g||!(g.members||[]).some(m=>m.id===id)) return;
      const rest=(g.members||[]).filter(m=>m.id!==id).map(m=>({...m}));
      if(rest.length){
        if(!rest.some(m=>m.admin)) rest[0].admin=true;
        ops.push(fbDb.collection("groups").doc(g.id).set({...cleanGroup({...g,members:rest}),updatedAt:Date.now()}));
      }else ops.push(fbDb.collection("groups").doc(g.id).delete());
    });
    ops.push(fbDb.collection("users").doc(id).delete());
    ops.push(fbDb.collection("friends").doc(id).delete());
    ops.push(fbDb.collection("requests").doc(id).delete());
    await Promise.all(ops);
    await fbAuth.currentUser.delete();
  }catch(e){
    startFbSync();
    throw e;
  }
}
async function cacheProfiles(ids){
  const users=getUsers();let ch=false;
  await Promise.all(ids.filter(id=>!users[id]).map(async id=>{
    try{
      const p=await fbGetUser(id);
      if(p){users[id]={displayName:p.displayName||id,avatar:p.avatar||null,banner:p.banner||"#1d3eb2"};ch=true}
    }catch(e){console.warn(e)}
  }));
  if(ch) save(STORAGE.users,users);
}
function startFbSync(){
  stopFbListeners();
  if(!fbReady||!currentUser) return;
  const uid=currentUser.id;
  const run=()=>{
    unsubFriends=fbDb.collection("friends").doc(uid).onSnapshot(async s=>{
      const list=s.exists?(s.data().list||[]):[];
      const all=load(STORAGE.friends,{});all[uid]=list;save(STORAGE.friends,all);
      // une demande que j'avais envoyée et qui est acceptée disparaît des demandes en attente
      const rm=getReqMap();let ch=false;
      list.forEach(f=>{if((rm[f]||[]).includes(uid)){rm[f]=rm[f].filter(x=>x!==uid);ch=true}});
      if(ch) save(STORAGE.requests,rm);
      await cacheProfiles(list);
      if(currentUser) renderFriends();
    },e=>{console.warn("friends",e);showToast("Erreur Firebase : "+fbErrMsg(e))});
    unsubUser=fbDb.collection("requests").doc(uid).onSnapshot(async s=>{
      const list=s.exists?(s.data().list||[]):[];
      const rm=getReqMap();rm[uid]=list;save(STORAGE.requests,rm);
      await cacheProfiles(list);
      if(currentUser) renderFriends();
    },e=>{console.warn("requests",e);showToast("Erreur Firebase : "+fbErrMsg(e))});
  };
  const runGroups=()=>{
    // groupes créés avant la synchro : envoyés une seule fois dans le cloud
    Object.values(getGroups()).forEach(g=>{
      if(g&&!g._cloud&&(g.members||[]).some(m=>m.id===uid)) cloudGroupSave(g);
    });
    let first=true;
    unsubGroups=fbDb.collection("groups").where("memberIds","array-contains",uid).onSnapshot(async snap=>{
      const cloud={};
      snap.forEach(d=>{const g=d.data();if(g&&g.id){g._cloud=true;cloud[g.id]=g}});
      const all=getGroups();
      let removedActive=false;
      Object.keys(all).forEach(id=>{
        if(all[id]&&all[id]._cloud&&!cloud[id]){
          delete all[id];
          const gm=load(STORAGE.gmsgs,{});delete gm[id];save(STORAGE.gmsgs,gm);
          if(activeGroupId===id) removedActive=true;
        }
      });
      Object.keys(cloud).forEach(id=>{all[id]=cloud[id]});
      saveGroups(all);
      if(first){
        first=false;
        const seen=getGroupSeen(uid);
        Object.keys(cloud).forEach(id=>{if(!seen.includes(id))seen.push(id)});
        setGroupSeen(uid,seen);
      }
      const ids=new Set();
      Object.values(cloud).forEach(g=>(g.members||[]).forEach(m=>ids.add(m.id)));
      await cacheProfiles([...ids]);
      if(!currentUser) return;
      if(removedActive){showNoChat();showToast("Vous ne faites plus partie de ce groupe.")}
      else if(activeGroupId&&cloud[activeGroupId]) openGroup(activeGroupId);
      renderFriends();
    },e=>{console.warn("groups",e);showToast("Erreur Firebase : "+fbErrMsg(e))});
  };
  if(fbAuth.currentUser){run();runGroups()}
  else{const off=fbAuth.onAuthStateChanged(u=>{if(u){off();run();runGroups()}})}
}

function remainingLabel(ends){
  const ms=ends-Date.now();
  if(ms<=0)return "Terminé";
  const h=Math.round(ms/3600000);
  if(h<48)return Math.max(1,h)+" heure"+(h>1?"s":"")+" restante"+(h>1?"s":"");
  const d=Math.round(ms/86400000);
  return d+" jour"+(d>1?"s":"")+" restant"+(d>1?"s":"");
}
function voteWord(n){return n<=1?n+" vote":n+" votes"}
function renderMessages(){
  if(!inChat())return;
  const el=document.getElementById("messages");el.innerHTML="";

function pollCardHtml(m,idx){
  const p=m.poll;const ended=Date.now()>p.at+p.ms;
  const mine=(p.votes&&p.votes[currentUser.id])||[];
  const picked=pollPicked[idx]||(mine.length?mine:[]);
  const voted=mine.length>0;
  const counts=p.opts.map(()=>0);
  Object.values(p.votes||{}).forEach(arr=>arr.forEach(i=>{if(counts[i]!=null)counts[i]++}));
  const total=Object.keys(p.votes||{}).length;
  const show=ended||voted||p.showResults;
  const hint=p.multi?"Sélectionne une ou plusieurs réponses":"Sélectionne une réponse";
  const opts=p.opts.map((opt,i)=>{
    const sel=(voted?mine:picked).includes(i);
    const pct=total?Math.round(counts[i]/total*100):0;
    return `<button type="button" class="poll-opt ${sel?"on":""}" data-opt="${i}">
      ${show?`<span class="poll-fill" style="width:${pct}%"></span>`:""}
      <span class="poll-opt-inner"><span>${esc(opt)}${show?`<span style="display:block;font-size:11px;color:var(--muted);margin-top:2px">${pct}% ${voteWord(counts[i])}</span>`:""}</span>
      <span style="width:18px;height:18px;border-radius:50%;border:1.5px solid ${sel?"var(--accent)":"var(--muted)"};background:${sel&&show?"var(--accent)":sel?"#c7d2fe":"transparent"};display:flex;align-items:center;justify-content:center;font-size:11px">${sel&&show?"✓":""}</span></span>
    </button>`;
  }).join("");
  let action="";
  if(!ended&&!voted) action=`<button type="button" class="vote-btn" data-act="vote" ${picked.length?"":"disabled"}>Voter</button>`;
  else if(!ended&&voted) action=`<button type="button" class="unvote-btn" data-act="unvote">Supprimer le vote</button>`;
  return `<div class="poll-card" data-poll="${idx}">
    <div style="font-weight:600">${esc(p.q)}</div>
    <div style="font-size:12px;color:var(--muted);margin:4px 0 6px">${hint}</div>
    ${opts}${action}
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px">
      <span>${voteWord(total)} · ${remainingLabel(p.at+p.ms)}</span>
      ${!show&&!ended?`<button type="button" data-act="results" style="background:none;border:none;color:var(--accent);cursor:pointer">Afficher les résultats</button>`:""}
    </div>
  </div>`;
}
function bindPollCard(card){
  const idx=+card.dataset.poll;
  const list=loadMsgs();
  const m=list[idx];if(!m||!m.poll)return;
  card.querySelectorAll("[data-opt]").forEach(btn=>btn.onclick=()=>{
    if(Date.now()>m.poll.at+m.poll.ms)return;
    if((m.poll.votes[currentUser.id]||[]).length)return;
    const i=+btn.dataset.opt;
    let cur=pollPicked[idx]?[...pollPicked[idx]]:[];
    if(m.poll.multi){cur=cur.includes(i)?cur.filter(x=>x!==i):[...cur,i]}
    else cur=cur[0]===i?[]:[i];
    pollPicked[idx]=cur;renderMessages();
  });
  const vote=card.querySelector("[data-act=vote]");
  if(vote) vote.onclick=()=>{
    const cur=pollPicked[idx]||[];if(!cur.length)return;
    m.poll.votes[currentUser.id]=cur;storeMsgs(list);renderMessages();
  };
  const un=card.querySelector("[data-act=unvote]");
    if(un) un.onclick=()=>{delete m.poll.votes[currentUser.id];pollPicked[idx]=[];storeMsgs(list);renderMessages()};
  const res=card.querySelector("[data-act=results]");
  if(res) res.onclick=()=>{m.poll.showResults=true;storeMsgs(list);renderMessages()};
}

  if(!q)return;
  const users=getUsers();

async function submitAddSearch(){
  const fid=document.getElementById("add-id").value.trim().toLowerCase().replace(/^@/,"");
  const err=document.getElementById("add-err");
  err.textContent="";
  if(!fid)return;
  if(fid===currentUser.id){err.textContent="Impossible.";return}
  if(getFriends(currentUser.id).includes(fid)){
    closeOverlayEl(document.getElementById("req-overlay"));
    openChat(fid);return;
  }
  let users=getUsers();
  if(!users[fid] && fbReady){
    err.textContent="Recherche…";
    try{
      const p=await fbGetUser(fid);
      if(p){
        users=getUsers();
        users[fid]={displayName:p.displayName||fid,avatar:p.avatar||null,banner:p.banner||"#1d3eb2"};
        save(STORAGE.users,users);
      }
    }catch(e){console.warn(e);err.textContent=fbErrMsg(e);return}
    err.textContent="";
    users=getUsers();
  }
  if(!users[fid]){err.textContent="Introuvable.";return}
  if(fbReady){
    try{
      const rq=await fbGetRequests(fid);
      const rm=getReqMap();rm[fid]=rq||[];save(STORAGE.requests,rm);
    }catch(e){console.warn(e);err.textContent=fbErrMsg(e);return}
  }
  if(incomingFor(currentUser.id).includes(fid)){openReqDialog("accept",fid);return}
  if((getReqMap()[fid]||[]).includes(currentUser.id)){err.textContent="Demande déjà envoyée.";return}
  openReqDialog("send",fid);
}

      renderGroupInfo();

function saveGroupEdit(){
  if(!groupEdit||!activeGroupId)return;
  const name=(document.getElementById("ginfo-name")?.value||groupEdit.name||"").trim();
  if(!name){showToast("Indique un nom.");return}
  const groups=getGroups();
  const g=groups[activeGroupId];if(!g)return;
  let members=groupEdit.members.filter(m=>!groupEdit.ban[m.id]).map(m=>({id:m.id,admin:!!m.admin}));
  Object.keys(groupEdit.add).forEach(id=>{
    if(!members.some(m=>m.id===id)) members.push({id,admin:!!(groupEdit.add[id]&&groupEdit.add[id].admin)});
  });
  // ensure at least one admin
  if(!members.some(m=>m.admin)){
    const me=members.find(m=>m.id===currentUser.id);
    if(me) me.admin=true;
  }
  g.name=name;g.avatar=groupEdit.avatar;g.banner=groupEdit.banner||"#1d3eb2";g.members=members;
  saveGroups(groups);
  cloudGroupSave(g);
  showToast("Groupe mis à jour !");
  groupInfoView="card";groupEdit=null;groupInfoPalette=false;
  openGroup(activeGroupId);
  renderGroupInfo();
  renderFriends();
}

      if(fbReady&&fbAuth&&fbAuth.currentUser){
        delBtn.disabled=true;er.textContent="";
        try{
          if(!(await fbCheckPassword(pw))){er.textContent="Mot de passe incorrect.";delBtn.disabled=false;return}
          await deleteCloudAccount(u.id);
        }catch(e){console.warn(e);er.textContent=fbErrMsg(e);delBtn.disabled=false;return}
      }else if(await hashPassword(pw)!==u.password){er.textContent="Mot de passe incorrect.";return}
      const users=getUsers();delete users[u.id];save(STORAGE.users,users);
      const fr=load(STORAGE.friends,{});delete fr[u.id];Object.keys(fr).forEach(k=>{fr[k]=(fr[k]||[]).filter(x=>x!==u.id)});save(STORAGE.friends,fr);
      const rq=getReqMap();delete rq[u.id];Object.keys(rq).forEach(k=>{rq[k]=(rq[k]||[]).filter(x=>x!==u.id)});save(STORAGE.requests,rq);
      logout();
    };
  } else {
    sheet.classList.remove("card-lock");sheet.classList.add("edit-lock");
    sheet.innerHTML=`
      <div class="edit-top">
        <button class="back" id="back-card" type="button">‹ Modifier le compte</button>
        <button class="save-btn" id="save-edit" type="button">Enregistrer</button>
      </div>
      <div class="edit-body">
        <div class="edit-banner-wrap">
          <button class="banner" id="edit-banner-btn" type="button" style="background:${banner}"><span class="banner-pen">✎</span></button>
        </div>
        <div class="pp-edit" id="pick-pp"><img src="${img}"><span>✎</span></div>
        <div class="field-label">Pseudo (vu par les utilisateurs)</div>
        <input class="pill-input" id="edit-display" value="${esc(u.displayName)}">
        <div class="field-label" style="margin-top:10px">Identifiant unique</div>
        <input class="pill-input" id="edit-id" value="${esc(u.id)}" readonly aria-readonly="true" style="opacity:.55;cursor:not-allowed">
        <p style="font-size:12px;color:var(--muted);margin:4px 0 0">L'identifiant ne peut pas être modifié.</p>
        <p style="margin-top:16px;font-weight:600">Changer de mot de passe</p>
        <p style="font-size:12px;color:var(--muted);margin:4px 0 8px">Veuillez entrer votre mot de passe pour changer celui-ci</p>
        <div class="field-label">Mot de passe actuel</div><input class="pill-input" id="pw-cur" type="password">
        <div class="field-label" style="margin-top:8px">Nouveau mot de passe</div><input class="pill-input" id="pw-new" type="password">
        <div class="field-label" style="margin-top:8px">Confirmer nouveau mot de passe</div><input class="pill-input" id="pw-conf" type="password">
        <p class="error-msg" id="edit-err"></p>
      </div>`;
    sheet.querySelector("#back-card").onclick=()=>{profileView="card";paletteOpen=false;renderSheet()};
    sheet.querySelector("#edit-banner-btn").onclick=()=>{paletteOpen=!paletteOpen;renderSheet()};
    sheet.querySelector("#pick-pp").onclick=()=>document.getElementById("avatar-file").click();
    sheet.querySelector("#save-edit").onclick=saveEdit;
  }
  renderColorSheet();
}
document.getElementById("avatar-file").onchange=e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{pendingAvatar=r.result;if(profileView==="card"){currentUser.avatar=pendingAvatar;persistUser()}renderSheet()};r.readAsDataURL(f);
};
async function saveEdit(){
  const er=sheet.querySelector("#edit-err");er.textContent="";
  const display=sheet.querySelector("#edit-display").value.trim();
  const nid=currentUser.id; // l'identifiant n'est pas modifiable
  const cur=sheet.querySelector("#pw-cur").value,nw=sheet.querySelector("#pw-new").value,cf=sheet.querySelector("#pw-conf").value;
  if(!display){er.textContent="Pseudo invalide.";return}
  if(nw||cf||cur){
    if(!cur){er.textContent="Veuillez entrer votre mot de passe pour changer celui-ci";return}
    const useFb=fbReady&&fbAuth&&fbAuth.currentUser;
    if(useFb){
      let ok=false;
      try{ok=await fbCheckPassword(cur)}catch(e){console.warn(e);er.textContent=fbErrMsg(e);return}
      if(!ok){er.textContent="Mot de passe actuel incorrect.";return}
    }else if(await hashPassword(cur)!==currentUser.password){er.textContent="Mot de passe actuel incorrect.";return}
    if(nw.length<6){er.textContent="Nouveau mot de passe trop court.";return}
    if(nw!==cf){er.textContent="Les mots de passe ne correspondent pas.";return}
    if(useFb){
      try{await fbAuth.currentUser.updatePassword(nw)}catch(e){console.warn(e);er.textContent=fbErrMsg(e);return}
    }else currentUser.password=await hashPassword(nw);
  }
  const users=getUsers();
  if(nid!==currentUser.id){
    if(users[nid]){er.textContent="Cet identifiant est déjà pris.";return}
    users[nid]={...users[currentUser.id],displayName:display,avatar:pendingAvatar??currentUser.avatar,banner:currentUser.banner,password:currentUser.password};
    delete users[currentUser.id];
    const fr=load(STORAGE.friends,{});fr[nid]=fr[currentUser.id]||[];delete fr[currentUser.id];
    Object.keys(fr).forEach(k=>{fr[k]=(fr[k]||[]).map(x=>x===currentUser.id?nid:x)});
    save(STORAGE.friends,fr);
    const rq=getReqMap();
    if(rq[currentUser.id]){rq[nid]=rq[currentUser.id];delete rq[currentUser.id]}
    Object.keys(rq).forEach(k=>{rq[k]=(rq[k]||[]).map(x=>x===currentUser.id?nid:x)});
    save(STORAGE.requests,rq);
    const msgs=load(STORAGE.messages,{});
    Object.keys(msgs).forEach(key=>{
      const parts=key.split("|").map(x=>x===currentUser.id?nid:x).sort().join("|");
      if(parts!==key){msgs[parts]=msgs[key];delete msgs[key]}
      (msgs[parts]||[]).forEach(m=>{if(m.from===currentUser.id)m.from=nid});
    });
    save(STORAGE.messages,msgs);
    currentUser.id=nid;setSession(nid);
  }
  currentUser.displayName=display;currentUser.avatar=pendingAvatar??currentUser.avatar;
  users[currentUser.id]={...users[currentUser.id],...currentUser};
  save(STORAGE.users,users);refreshMe();profileView="card";renderSheet();
}
function logout(){
  if(refreshTick){clearInterval(refreshTick);refreshTick=null}
  stopFbListeners();
  try{if(fbReady)fbAuth.signOut()}catch(_){}
  setSession(null);currentUser=null;overlay.classList.add("hidden");
  colorSheet.classList.add("hidden");
  closeOverlayEl(document.getElementById("req-overlay"));
  document.getElementById("group-overlay").classList.add("hidden");
  document.getElementById("group-info-overlay")?.classList.add("hidden");
  authScreen.classList.remove("hidden");appScreen.classList.add("hidden");
}
const sidebar=document.getElementById("sidebar");const chatArea=document.getElementById("chat-area");
(function(){const sid=getSession();if(sid&&getUsers()[sid]){currentUser={id:sid,...getUsers()[sid]};showApp()}else{authScreen.classList.remove("hidden");appScreen.classList.add("hidden")}})();
</script>
</body>
</html>
